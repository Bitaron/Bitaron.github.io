title: Kamruzzaman
home_title: "Engineering resilient platforms"
home_tagline: "Software architect, technical leader, and writer."
default_image: /assets/images/default-card.svg
default_banner: ""
description: >-
  Portfolio, résumé, and articles by Kamruzzaman on resilient platforms,
  clean architecture, and engineering leadership.
url: "https://bitaron.github.io"
baseurl: ""
lang: en

sass:
  style: compressed

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /articles/:title/

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate

paginate: 6
paginate_path: "/page:num/"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - AGENTS.md
  - .claude
  - .vscode
  - node_modules
  - vendor
  - Templates

collections:
  series:
    output: true
    permalink: /series/:path/
  series_drafts:
    output: true
    permalink: /series/:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "series"
    values:
      layout: "series"
  - scope:
      path: ""
      type: "series_drafts"
    values:
      layout: "series"
